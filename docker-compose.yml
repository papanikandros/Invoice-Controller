# Invoice-Controller server deployment (todo #8, 2026-09-16):
# app (NiceGUI web UI) behind a Caddy reverse proxy — Caddy is the ONLY published
# entrance (TLS + basic-auth outer layer; IC_WEB_PASSWORD stays the inner gate).
#
#   cp .env.example .env        # fill provider key + IC_WEB_* + IC_BASIC_AUTH_*
#   docker compose up -d --build
#
# Ollama service deliberately left out for now (user decision 2026-09-16) — it
# slots in here when A2 (local model routing) lands.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # Run history (uploads + outputs + audit.jsonl, last 20 runs). On a shared
      # server this holds client documents — see the retention note in PRIVACY.md §6.
      - webruns:/app/tmp/webruns
    expose:
      - "8080"          # container network only; never published on the host

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Domain for automatic TLS (Let's Encrypt). Leave default for a LAN box:
      # "localhost" serves with Caddy's internal CA on https://localhost.
      IC_DOMAIN: ${IC_DOMAIN:-localhost}
      IC_BASIC_AUTH_USER: ${IC_BASIC_AUTH_USER:?set in .env}
      # Generate with: docker run --rm caddy:2-alpine caddy hash-password --plaintext '...'
      IC_BASIC_AUTH_HASH: ${IC_BASIC_AUTH_HASH:?set in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  webruns:
  caddy_data:
  caddy_config:
