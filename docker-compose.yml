# Invoice-Controller server deployment: the NiceGUI web UI only.
# TLS and the hostname live in the SHARED Caddy stack (~/Workspace/server-proxy →
# /opt/proxy on the server), which reaches this app over the external docker network
# "proxy" under the alias "invoice-app". The app port is never published on the host.
# Access control is the app's own login page (IC_WEB_PASSWORD, throttled per address) —
# the proxy adds no basic-auth since 2026-09-28, so the password is REQUIRED here.
#
#   cp .env.example .env        # provider key + IC_WEB_PASSWORD + IC_WEB_STORAGE_SECRET
#   docker compose up -d --build   (the proxy stack must be up first: it creates the network)
#
# Ollama service deliberately left out for now (user decision 2026-09-16) — it
# slots in here when A2 (local model routing) lands.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # Run history (uploads + outputs + audit.jsonl, last 100 runs). On a shared
      # server this holds client documents — see the retention note in PRIVACY.md §6.
      - webruns:/app/tmp/webruns
    expose:
      - "8080"          # container network only; never published on the host
    networks:
      proxy:
        aliases:
          - invoice-app   # the name the shared Caddy proxies to

volumes:
  webruns:

networks:
  proxy:
    external: true      # created by the shared proxy stack
